<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrelacs — Invitations élégantes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap">
<style>
:root{--bg:#FBF7F0;--ink:#12302F;--mut:#5c6b68;--gold:#B8923F;--line:#e6dcc8;--deep:#10302F;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 'Jost','Amiri',system-ui,sans-serif}
[dir=rtl] body{font-family:'Amiri','Jost',serif;font-size:18px}
h1,h2,h3{font-family:'Cormorant Garamond','Amiri',serif;font-weight:400;line-height:1.1;margin:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:12px}
.logo{font:italic 600 28px 'Cormorant Garamond',serif;text-decoration:none}
nav{display:flex;gap:18px;align-items:center}nav a{text-decoration:none;color:var(--mut)}
.btn{border:0;border-radius:999px;padding:12px 24px;background:var(--deep);color:#fff;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold)}.btn.line{background:none;border:1px solid var(--line);color:var(--ink);padding:8px 16px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;padding:30px 0 70px}
.hero h1{font-size:clamp(40px,6vw,74px)}.lead{font-size:18px;color:var(--mut);max-width:44ch;margin:20px 0 26px}
.fan{display:flex;justify-content:center;padding:20px 0}.fan>*{width:38%;margin:0 -4%;box-shadow:0 20px 40px -18px #0006}
.fan>:nth-child(1){transform:rotate(-7deg)}.fan>:nth-child(2){transform:translateY(-14px);z-index:2}.fan>:nth-child(3){transform:rotate(7deg)}
.sec{padding:60px 0}.sec h2{font-size:clamp(30px,4vw,46px);margin-bottom:8px}.sub{color:var(--mut);margin:0 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.tc{background:none;border:0;padding:0;text-align:inherit}.tc .card{box-shadow:0 14px 28px -14px #0007;transition:transform .25s}.tc:hover .card{transform:translateY(-4px)}
.tc span{display:block;margin-top:10px;font:italic 21px 'Cormorant Garamond','Amiri',serif}
.ed{display:grid;grid-template-columns:380px 1fr;gap:30px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.f input,.f select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.sw button.on{box-shadow:0 0 0 2px var(--ink)}
.prev{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:14px;padding:30px 10px;background:radial-gradient(circle,#efe3c8,transparent 72%)}
.prev .card{max-width:420px;box-shadow:0 30px 60px -25px #000a}.hint{font-size:13px;color:var(--mut);text-align:center;max-width:42ch;margin:0}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.plan{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}.plan.best{background:var(--deep);color:#fff}
.plan h3{font-size:30px}.pr{font:600 42px 'Cormorant Garamond',serif;margin:6px 0}.plan ul{padding-inline-start:18px;margin:0 0 20px;color:var(--mut)}.best ul{color:#d8e6e2}
footer{padding:30px 0;color:var(--mut);font-size:14px;border-top:1px solid var(--line)}
/* Carte */
.card{container-type:inline-size;width:100%;max-width:340px;aspect-ratio:5/7;background:var(--b);color:var(--k);position:relative;overflow:hidden;display:flex;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card .in{margin:auto;width:76%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2cqw;position:relative;z-index:1}
.card p,.card h4{margin:0}.card .ti{font:400 10cqw/1.05 var(--fd);color:var(--a)}.card .nm{font:400 11cqw/1.05 var(--fd);color:var(--a)}
.card .it,.card .dt,.card .pl,.card .ot{font-family:var(--fb);font-size:4.3cqw;line-height:1.3}.card .dt{font-size:5.4cqw}.card .ot{font-style:italic;opacity:.85}
.card .ru{width:18cqw;height:1px;background:var(--a);margin:1.5cqw 0}
.d-frame::before{content:"";position:absolute;inset:4cqw;border:1px solid var(--a);outline:1px solid var(--a);outline-offset:-7px}
.d-geo::before{content:"";position:absolute;inset:6cqw;border:1px solid var(--a)}
.d-geo::after{content:"";position:absolute;top:0;right:0;width:50cqw;height:50cqw;background:linear-gradient(135deg,transparent 48%,var(--a) 49%,transparent 50.5%),linear-gradient(160deg,transparent 60%,var(--a) 61%,transparent 62%);opacity:.6}
.d-glow{background:radial-gradient(circle at 8% 6%,color-mix(in srgb,var(--a) 60%,transparent),transparent 34%),radial-gradient(circle at 96% 14%,color-mix(in srgb,var(--a) 45%,transparent),transparent 28%),radial-gradient(circle at 90% 98%,color-mix(in srgb,var(--a) 50%,transparent),transparent 30%),var(--b)}
.d-bloom{background:radial-gradient(circle at 4% 4%,color-mix(in srgb,var(--a) 38%,transparent),transparent 36%),radial-gradient(circle at 98% 98%,color-mix(in srgb,var(--a) 38%,transparent),transparent 36%),var(--b)}
.d-bloom::before{content:"";position:absolute;inset:5cqw;border:1px solid var(--a);opacity:.6}
.d-arch::before{content:"";position:absolute;inset:5cqw;border:2px solid var(--a);border-radius:999px 999px 0 0;box-shadow:inset 0 0 0 2cqw var(--b),inset 0 0 0 2.4cqw var(--a)}
.d-arch .in,.d-moon .in{padding-top:12cqw}
.d-moon::before{content:"";position:absolute;top:8cqw;left:50%;width:14cqw;height:14cqw;margin-left:-7cqw;border-radius:50%;box-shadow:inset -3.6cqw 0 0 0 var(--a);transform:rotate(-20deg)}
.d-moon::after{content:"";position:absolute;inset:0 0 70% 0;background:radial-gradient(circle,var(--a) 1px,transparent 2px) 18% 25%/1px 1px no-repeat,radial-gradient(circle,var(--a) 1.5px,transparent 3px) 80% 18%/1px 1px no-repeat,radial-gradient(circle,var(--a) 1px,transparent 2px) 70% 55%/1px 1px no-repeat,radial-gradient(circle,var(--a) 1.5px,transparent 3px) 28% 62%/1px 1px no-repeat}
#toast{display:none}
@media (max-width:860px){.hero,.ed,.plans{grid-template-columns:1fr}.prev{position:static}nav a.hd{display:none}}
@page{size:148mm 207mm;margin:0}
@media print{header,footer,.sec:not(#editeur),#editeur .panel,#editeur h2,#editeur .sub,#editeur .btn,#editeur .hint{display:none!important}
.sec,.wrap,.ed,.prev{padding:0!important;margin:0!important;max-width:none!important;display:block!important;background:none!important}
.prev .card{width:148mm!important;max-width:none!important;height:207mm;aspect-ratio:auto;box-shadow:none!important}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="#">Entrelacs</a>
<nav><a class="hd" href="#modeles" data-i="nTpl"></a><a class="hd" href="#formules" data-i="nPack"></a><button class="btn line" id="lang">العربية</button><a class="btn" href="#modeles" data-i="nCreate"></a></nav></header>
<div class="hero"><div><h1 data-i="h1"></h1><p class="lead" data-i="lead"></p><a class="btn gold" href="#modeles" data-i="cta"></a></div><div class="fan" id="fan"></div></div>
</div>
<div class="sec" id="modeles"><div class="wrap"><h2 data-i="tplT"></h2><p class="sub" data-i="tplS"></p><div class="grid" id="gal"></div></div></div>
<div class="sec" id="editeur"><div class="wrap"><h2 data-i="edT"></h2><p class="sub" data-i="edS"></p>
<div class="ed"><div class="panel">
<div class="f"><label for="title" data-i="lTitle"></label><input id="title" dir="auto"></div>
<div class="f"><label for="intro" data-i="lIntro"></label><input id="intro" dir="auto"></div>
<div class="f"><label for="names" data-i="lNames"></label><input id="names" dir="auto"></div>
<div class="row"><div class="f"><label for="date" data-i="lDate"></label><input id="date" type="date"></div><div class="f"><label for="time" data-i="lTime"></label><input id="time" type="time"></div></div>
<div class="row"><div class="f"><label for="place" data-i="lPlace"></label><input id="place" dir="auto"></div><div class="f"><label for="city" data-i="lCity"></label><input id="city" dir="auto"></div></div>
<div class="f"><label for="outro" data-i="lOutro"></label><input id="outro" dir="auto"></div>
<div class="f"><label for="font" data-i="lFont"></label><select id="font"></select></div>
<div class="f"><label data-i="lAcc"></label><div class="sw" id="sw"></div></div>
</div>
<div class="prev"><div id="edCard" style="width:100%;display:flex;justify-content:center"></div><button class="btn gold" id="print" data-i="print"></button><p class="hint" data-i="hint"></p></div></div></div></div>
<div class="sec" id="formules"><div class="wrap"><h2 data-i="packT"></h2><p class="sub" data-i="packS"></p><div class="plans" id="plans"></div></div></div>
<footer><div class="wrap" data-i="foot"></div></footer>
<script>
const T=[{c:'mariage',b:'#FBF4EA',k:'#3a2f26',a:'#B8923F',d:'geo'},{c:'fiancailles',b:'linear-gradient(#4b5273,#e9a972)',k:'#fff7ea',a:'#f5d9a0',d:'geo'},{c:'anniversaire',b:'#0c0a08',k:'#f3e3b5',a:'#D9B25F',d:'glow'},{c:'bapteme',b:'#F9E1E0',k:'#5b2230',a:'#8B1E3F',d:'bloom'},
{c:'soiree',b:'#0F3B33',k:'#f5e6bd',a:'#D9B25F',d:'arch'},{c:'aid',b:'linear-gradient(#142458,#0b1230)',k:'#f3e3b5',a:'#E3C275',d:'moon'},{c:'gala',b:'#FBF8F3',k:'#4a1f2a',a:'#7A1E2E',d:'bloom'},{c:'pro',b:'#F3F5F0',k:'#2d3a2e',a:'#6F8660',d:'frame'}];
const C={mariage:{fr:['','Nous avons le plaisir de vous inviter au mariage de','Sophie & Thomas','Votre présence fera notre bonheur'],ar:['','يسرّنا أن ندعوكم لحضور حفل زفاف','سارة و ياسين','حضوركم يسعدنا']},
fiancailles:{fr:['Fiançailles','Nous avons le plaisir de vous inviter à célébrer nos fiançailles','Lina & Omar','Votre présence rendra ce moment encore plus spécial'],ar:['خطوبة','يسرّنا أن ندعوكم للاحتفال بخطوبتنا','ليلى و عمر','حضوركم يزيد هذه اللحظة جمالاً']},
anniversaire:{fr:['Anniversaire','Nous vous invitons à célébrer mes 30 ans','Yasmine','Votre présence sera le plus beau des cadeaux'],ar:['عيد ميلاد','ندعوكم للاحتفال بعيد ميلادي الثلاثين','ياسمين','حضوركم أجمل هدية']},
bapteme:{fr:['Baptême','de notre petite','Lina','Avec tout notre amour'],ar:['تعميد','بمناسبة تعميد طفلتنا الصغيرة','لينا','مع خالص المحبة']},
soiree:{fr:['Soirée Orientale','Nous vous invitons à une soirée inoubliable','','Tenue traditionnelle souhaitée'],ar:['سهرة شرقية','ندعوكم إلى سهرة لا تُنسى','','اللباس التقليدي مفضّل']},
aid:{fr:['Aïd Mubarak','Nous vous souhaitons un joyeux Aïd plein de bonheur et de sérénité','','Qu’Allah accepte nos bonnes actions'],ar:['عيد مبارك','نتمنى لكم عيداً سعيداً مليئاً بالفرح والطمأنينة','','تقبّل الله منا ومنكم صالح الأعمال']},
gala:{fr:['Dîner de Gala','Nous avons le plaisir de vous convier à notre dîner de gala','','Votre présence sera un honneur'],ar:['عشاء رسمي','يسرّنا أن ندعوكم إلى عشاء رسمي','','حضوركم شرف لنا']},
pro:{fr:['Événement Spécial','Nous avons le plaisir de vous inviter à notre événement','','Votre présence est très attendue'],ar:['مناسبة خاصة','يسرّنا أن ندعوكم إلى مناسبتنا','','حضوركم مهم جداً']}};
const CN={fr:['Mariage','Fiançailles','Anniversaire','Baptême','Soirée orientale','Aïd','Dîner de gala','Événement pro'],ar:['زفاف','خطوبة','عيد ميلاد','تعميد','سهرة شرقية','عيد مبارك','عشاء رسمي','مناسبة مهنية']};
const I={fr:{nTpl:'Modèles',nPack:'Formules',nCreate:'Créer mon invitation',h1:'Vos invitations, aussi belles que votre fête.',lead:'Choisissez un modèle, écrivez vos mots, voyez le résultat en direct, puis enregistrez-le en PDF prêt à imprimer.',cta:'Voir les modèles',tplT:'Un modèle pour chaque occasion',tplS:'Touchez un modèle pour le personnaliser.',edT:'Personnalisez votre invitation',edS:'Tout ce que vous écrivez apparaît tout de suite sur la carte.',lTitle:'Titre',lIntro:'Phrase d’accueil',lNames:'Noms',lDate:'Date',lTime:'Heure',lPlace:'Lieu',lCity:'Ville',lOutro:'Phrase finale',lFont:'Police',lAcc:'Couleur de la décoration',print:'Imprimer / enregistrer en PDF',hint:'Dans la fenêtre d’impression, choisissez « Enregistrer au format PDF ». Format A5, prêt à imprimer.',fonts:['Élégante','Classique','Moderne'],place:'Salle Les Jardins Élégants',city:'Marrakech',packT:'Choisissez votre pack',packS:'Prix en dirhams marocains. Le paiement et l’activation automatique ne sont pas encore branchés.',packs:[['Starter',19,['Une invitation numérique','Plusieurs modèles','Lien partageable sur WhatsApp','Disponible 30 jours']],['Premium',39,['Tout le pack Starter','Animation et musique','Compte à rebours et Google Maps','RSVP et PDF imprimable']],['Prestige',69,['Tout le pack Premium','Un lien par invité','Tableau de bord et QR code','Jusqu’à 300 invités']]],cur:'DH',demo:'Voir l’exemple animé',create:'Créer mon invitation (version test)',soon:'Exemple bientôt disponible',foot:'Entrelacs — nom de travail, à remplacer par le vôtre.'},
ar:{nTpl:'النماذج',nPack:'الباقات',nCreate:'أنشئ دعوتك',h1:'دعواتك، بجمال مناسبتك.',lead:'اختر نموذجاً، اكتب كلماتك، وشاهد النتيجة مباشرة، ثم احفظها بصيغة PDF جاهزة للطباعة.',cta:'شاهد النماذج',tplT:'نموذج لكل مناسبة',tplS:'اضغط على نموذج لتخصيصه.',edT:'خصّص دعوتك',edS:'كل ما تكتبه يظهر فوراً على البطاقة.',lTitle:'العنوان',lIntro:'جملة الترحيب',lNames:'الأسماء',lDate:'التاريخ',lTime:'الوقت',lPlace:'المكان',lCity:'المدينة',lOutro:'الجملة الأخيرة',lFont:'الخط',lAcc:'لون الزخرفة',print:'طباعة / حفظ PDF',hint:'في نافذة الطباعة اختر «حفظ بتنسيق PDF». الحجم A5 جاهز للطباعة.',fonts:['أنيق','كلاسيكي','عصري'],place:'قاعة الحدائق',city:'مراكش',packT:'اختر باقتك',packS:'الأسعار بالدرهم المغربي. الدفع والتفعيل التلقائي غير مفعّلين بعد.',packs:[['ستارتر',19,['دعوة رقمية واحدة','نماذج متعددة','رابط للمشاركة عبر واتساب','متاحة 30 يوماً']],['بريميوم',39,['كل ميزات ستارتر','حركة وموسيقى','عدّاد تنازلي وخريطة','تأكيد الحضور وPDF']],['بريستيج',69,['كل ميزات بريميوم','رابط خاص لكل مدعو','لوحة تحكم ورمز QR','حتى 300 مدعو']]],cur:'درهم',demo:'شاهد المثال المتحرك',create:'أنشئ دعوتك (نسخة تجريبية)',soon:'المثال قريباً',foot:'Entrelacs — اسم مؤقت للمشروع.'}};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FONTS=["'Pinyon Script',cursive","'Cormorant Garamond',serif","'Jost',sans-serif"],ACC=['','#B8923F','#8B1E3F','#6F8660','#2F4A8A','#D2693F'];
let L='fr',ti=0,acc='',fo=0;const F={date:'2027-06-12',time:'18:30'};
function defs(i){const c=C[T[i].c][L];return{title:c[0],intro:c[1],names:c[2],outro:c[3],place:I[L].place,city:I[L].city}}
function card(i,f,a,fi){const t=T[i],ar=L==='ar',fd=ar?"'Amiri',serif":FONTS[fi||0],fb=ar?"'Amiri',serif":"'Cormorant Garamond',serif";
const d=f.date?new Date(f.date+'T12:00').toLocaleDateString(ar?'ar-MA-u-nu-latn':'fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
const tm=f.time?(ar?f.time:'à '+f.time.replace(':','h')):'';const h=(c,x,tag='p')=>x?`<${tag} class="${c}">${esc(x)}</${tag}>`:'';
return `<div class="card d-${t.d}" style="--b:${t.b};--k:${t.k};--a:${a||t.a};--fd:${fd};--fb:${fb}"><div class="in">${h('ti',f.title,'h4')}${h('it',f.intro)}${h('nm',f.names,'h4')}<div class="ru"></div>${h('dt',d)}${h('dt',tm)}${h('pl',[f.place,f.city].filter(Boolean).join(' — '))}${h('ot',f.outro)}</div></div>`}
function paint(){$('edCard').innerHTML=card(ti,F,acc,fo)}
function gallery(){$('gal').innerHTML=T.map((t,i)=>`<button class="tc" data-i="${i}">${card(i,{...defs(i),date:F.date,time:F.time})}<span>${CN[L][i]}</span></button>`).join('');
$('fan').innerHTML=[0,5,3].map(i=>card(i,{...defs(i),date:F.date,time:F.time})).join('')}
function fill(){Object.assign(F,defs(ti));['title','intro','names','date','time','place','city','outro'].forEach(k=>$(k).value=F[k])}
function texts(){const s=I[L];document.querySelectorAll('[data-i]').forEach(e=>e.textContent=s[e.dataset.i]);
$('lang').textContent=L==='fr'?'العربية':'Français';document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
$('font').innerHTML=s.fonts.map((n,i)=>`<option value="${i}">${n}</option>`).join('');$('font').value=fo;
$('plans').innerHTML=s.packs.map((p,i)=>`<div class="plan${i==1?' best':''}"><h3>${p[0]}</h3><div class="pr">${p[1]} ${s.cur}</div><ul>${p[2].map(x=>`<li>${x}</li>`).join('')}</ul>${i?`<a class="btn ${i==1?'gold':'line'}" href="${i==1?'premium.html':'prestige.html'}">${s.demo}</a>${i==2?`<a class="btn gold" href="creer-prestige.html" style="display:block;width:max-content;margin-top:8px">${s.create}</a>`:''}`:`<p class="sub" style="margin:0">${s.soon}</p>`}</div>`).join('')}
$('sw').innerHTML=ACC.map(c=>`<button style="background:${c||'conic-gradient(#B8923F,#8B1E3F,#2F4A8A,#B8923F)'}" data-c="${c}" aria-label="${c||'auto'}"></button>`).join('');
$('sw').onclick=e=>{const b=e.target.closest('button');if(b){acc=b.dataset.c;paint()}};
['title','intro','names','date','time','place','city','outro'].forEach(k=>$(k).oninput=()=>{F[k]=$(k).value;paint()});
$('font').onchange=()=>{fo=+$('font').value;paint()};
$('gal').onclick=e=>{const b=e.target.closest('.tc');if(b){ti=+b.dataset.i;acc='';fill();paint();$('editeur').scrollIntoView()}};
$('lang').onclick=()=>{L=L==='fr'?'ar':'fr';fill();texts();gallery();paint()};
$('print').onclick=()=>window.print();
fill();texts();gallery();paint();
</script>
</body>
</html>
